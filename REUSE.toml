version = 1

[[annotations]]
  path = [
    ".clang-format",
    ".gitignore",
    "CONTRIBUTING.md",
    "README.md",
    "meson.build",
    "meson_options.txt",
    "frontend/*",
    "frontend/main/**",
    "frontend/preload/**",
    "frontend/renderer/**",
    "frontend/resources/**",
    "frontend/shared/**",
    "backend/**",
    "include/**",
    "data/**",
  ]
  SPDX-FileCopyrightText = "2026-Present ninetailedtori <ninetailedtori@uwu.gal>"
  SPDX-FileContributor = "WhailMail contributors"
  SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
  path                    = [ "COPYING" ]
  precedence              = "override"
  SPDX-FileCopyrightText  = "2007 Free Software Foundation, Inc."
  SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
  path                    = [ "subprojects/*.wrap", "subprojects/packagefiles/**" ]
  SPDX-FileCopyrightText  = "2026-Present ninetailedtori <ninetailedtori@uwu.gal>"
  SPDX-FileContributor    = "WhailMail contributors"
  SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
  path                    = [ "frontend/public/fonts/JetBrainsMono/**" ]
  SPDX-FileCopyrightText  = "2014 Ryan L McIntyre (https://ryanlmcintyre.com)"
  SPDX-License-Identifier = "OFL-1.1"
