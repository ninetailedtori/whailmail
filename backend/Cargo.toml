[workspace]
  members = [
    "crates/whailmail-common",
    "crates/whailmail-db",
    "crates/whailmail-api",
    "crates/whailmail-server-smtp",
    "crates/whailmail-server-imap",
    "crates/whailmail-indexer",
    "crates/whailmail-filters",
    "crates/whailmail-tests",
  ]
  resolver = "2"

  [workspace.package]
    version      = "0.0.1"
    description  = "The app that makes handling your mail, a whale of a time!"
    edition      = "2024"
    license      = "GPL-3.0-or-later"
    license-file = "../COPYING"
    authors      = [ "ninetailedtori <ninetailedtori@uwu.gal>", "WhailMail Contributors" ]

  [workspace.metadata.features]
    # Deployment modes:
    # - api-only (default): REST-API and ext. mailserver connectors ONLY
    # - mailserver: Self-hosted/central instance (inc. IMAP/SMTP hosting)
    # - indexing: Local full-text search (next step owo)

  [workspace.dependencies]
    # Internal crates
    whailmail-api.path         = "crates/whailmail-api"
    whailmail-common.path      = "crates/whailmail-common"
    whailmail-db.path          = "crates/whailmail-db"
    whailmail-filters.path     = "crates/whailmail-filters"
    whailmail-indexer.path     = "crates/whailmail-indexer"
    whailmail-server-imap.path = "crates/whailmail-server-imap"
    whailmail-server-smtp.path = "crates/whailmail-server-smtp"
    whailmail-tests.path       = "crates/whailmail-tests"

    # Async runtime
    tokio      = { version = "1.52", features = [ "full" ] }
    tokio-util = "0.7"

    # Web framework
    axum       = "0.8"
    hyper      = "1.9"
    tower      = "0.5"
    tower-http = { version = "0.6", features = [ "cors", "trace", "fs" ] }

    # Database
    sqlx = { version = "0.9.0", features = [
      "chrono",
      "migrate",
      "postgres",
      "runtime-tokio",
      "sqlite",
      "uuid",
    ] }

    # Serialization & encoding
    base64     = "0.22"
    hex        = "0.4"
    serde      = { version = "1.0", features = [ "derive" ] }
    serde_json = "1.0"
    toml       = "1.1"

    # Auth & crypto
    argon2       = "0.5"
    bcrypt       = "0.19"
    jsonwebtoken = "10.3"
    sha1         = "0.11"
    sha2         = "0.11"
    uuid         = { version = "1.23", features = [ "v4", "serde" ] }

    # Email protocols
    imap        = "2.4"
    lettre      = { version = "0.11", features = [ "smtp", "builder" ] }
    mail-parser = "0.11"
    mailparse   = "0.16"
    mime        = "0.3"

    # TLS
    rustls           = { version = "0.23", features = [ "std" ] }
    rustls-pki-types = "1.14"

    # Indexing
    tantivy = "0.26"

    # Config
    config = "0.15"
    dotenv = "0.15"

    # Errors
    anyhow    = "1.0"
    thiserror = "2.0"

    # Logging
    tracing            = "0.1"
    tracing-subscriber = { version = "0.3", features = [ "env-filter", "json" ] }

    # Time
    chrono = { version = "0.4", features = [ "serde" ] }

    # WebSocket
    futures           = "0.3"
    tokio-tungstenite = "0.29"

    # Utils
    dirs        = "6.0"
    globset     = "0.4"
    once_cell   = "1.21"
    proc-macro2 = "1.0"
    regex       = "1.12"
    reqwest     = { version = "0.13", features = [ "json" ] }
    rstest      = "0.26"
    tempfile    = "3.27"

  [workspace.lints.rust]
    unsafe_code = "forbid"

  [workspace.lints.clippy]
    all         = "warn"
    complexity  = "warn"
    correctness = "warn"
    nursery     = "warn"
    pedantic    = "warn"
    perf        = "warn"
    style       = "warn"
    suspicious  = "warn"
