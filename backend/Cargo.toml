[workspace]
  members = [
    "crates/whailmail-common",
    "crates/whailmail-db",
    "crates/whailmail-api",
    "crates/whailmail-smtp",
    "crates/whailmail-imap",
    "crates/whailmail-indexer",
    "crates/whailmail-filters",
  ]
  resolver = "2"

  [workspace.package]
    version      = "0.1.0"
    edition      = "2024"
    license      = "GPL-3.0-or-later"
    license-file = "../COPYING"
    authors      = [ "ninetailedtori <ninetailedtori@uwu.gal>", "WhailMail Contributors" ]

  [workspace.metadata.features]
    # Deployment modes:
    # - api-only (default): REST-API and ext. mailserver connectors ONLY
    # - mailserver: Self-hosted/central instance (inc. IMAP/SMTP hosting)
    # - indexing: Local full-text search (next step owo)

  [workspace.dependencies]
    # Async runtime
    tokio      = { version = "1.52", features = [ "full" ] }
    tokio-util = "0.7"

    # Web framework
    axum       = "0.8"
    tower      = "0.5"
    tower-http = { version = "0.6", features = [ "cors", "trace", "fs" ] }
    hyper      = "1.9"

    # Database
    sqlx = { version = "0.8", features = [
      "runtime-tokio-native-tls",
      "sqlite",
      "postgres",
      "uuid",
      "chrono",
      "migrate",
    ] }

    # Serialization & encoding
    serde      = { version = "1.0", features = [ "derive" ] }
    serde_json = "1.0"
    base64     = "0.22"
    hex        = "0.4"
    toml       = "1.1"

    # Auth & crypto
    jsonwebtoken = "10.3"
    uuid         = { version = "1.23", features = [ "v4", "serde" ] }
    sha2         = "0.11"
    bcrypt       = "0.19"

    # Email protocols
    imap        = "2.4"
    lettre      = { version = "0.11", features = [ "smtp", "builder" ] }
    mail-parser = "0.11"
    mailparse   = "0.16"
    mime        = "0.3"

    # TLS
    rustls           = { version = "0.23", features = [ "std" ] }
    rustls-pki-types = "1.14"

    # Indexing
    tantivy = "0.26"

    # Config
    dotenv = "0.15"
    config = "0.15"

    # Errors
    thiserror = "2.0"

    # Logging
    tracing            = "0.1"
    tracing-subscriber = { version = "0.3", features = [ "env-filter", "json" ] }

    # Time
    chrono = { version = "0.4", features = [ "serde" ] }

    # WebSocket
    tokio-tungstenite = "0.29"
    futures           = "0.3"

    # Utils
    globset = { version = "0.4" }
    regex   = "1.12"
    reqwest = { version = "0.13", features = [ "json" ] }
    dirs    = "6.0"

  [workspace.lints.rust]
    unsafe_code = "forbid"

  [workspace.lints.clippy]
    all         = "warn"
    pedantic    = "warn"
    nursery     = "warn"
    suspicious  = "warn"
    complexity  = "warn"
    perf        = "warn"
    correctness = "warn"
    style       = "warn"
